<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>PulseChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="modal-backdrop" id="authModal">
    <div class="modal">
      <h2>PulseChat</h2>
      <p>Enter a unique handle to connect.</p>
      <input type="text" id="usernameInput" placeholder="e.g. nadir" autofocus maxlength="20" />
      <div class="error-text" id="authError"></div>
      <button class="btn-primary" id="loginBtn">Start Chatting</button>
    </div>
  </div>

  <div class="app-shell" id="appShell">
    
    <aside class="contacts-screen" id="contactsScreen">
      <div class="screen-header">
        <div class="user-profile">
          <div class="avatar" id="myAvatar">-</div>
          <div class="meta">
            <div class="id" id="myIdDisplay">Connecting...</div>
            <div class="badge">Online</div>
          </div>
        </div>
      </div>
      <div class="search-box">
        <input type="text" class="search-input" id="searchUser" placeholder="Search contacts..." />
      </div>
      <ul class="user-list" id="usersList"></ul>
    </aside>

    <main class="chat-screen" id="chatScreen">
      <div class="chat-header">
        <button class="back-btn" id="backBtn" aria-label="Back">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <div class="avatar" id="chatAvatar">?</div>
        <div class="chat-header-info">
          <div class="name" id="chatWithUser">Username</div>
          <div class="sub" id="chatUserStatus">offline</div>
        </div>
      </div>

      <div class="messages-container" id="messagesContainer"></div>

      <div class="typing-bar" id="typingIndicator">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span style="margin-left: 4px;" id="typingLabel">typing...</span>
      </div>

      <div class="emoji-drawer" id="emojiDrawer">
        <span class="emoji-item">😊</span>
        <span class="emoji-item">❤️</span>
        <span class="emoji-item">👍</span>
        <span class="emoji-item">🔥</span>
        <span class="emoji-item">🎉</span>
        <span class="emoji-item">✨</span>
        <span class="emoji-item">😂</span>
      </div>

      <div class="chat-footer">
        <button class="emoji-btn" id="emojiToggleBtn">☺</button>
        <input type="text" class="chat-input" id="messageInput" placeholder="Message..." autocomplete="off" />
        <button class="send-btn" id="sendBtn" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </main>

  </div>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="script.js"></script>
</body>
</html>

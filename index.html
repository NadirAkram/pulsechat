<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>PinkTalk Messenger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- AUTHENTICATION SCREEN -->
  <div id="auth-screen" class="screen active">
    <div class="auth-card">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
      </div>
      <h2>PinkTalk</h2>
      <p class="auth-subtitle">Login or register your account</p>

      <form id="auth-form" autocomplete="off">
        <div class="material-field">
          <input type="text" id="auth-username" required placeholder=" " />
          <label for="auth-username">User ID / Username</label>
        </div>

        <div class="material-field">
          <input type="password" id="auth-password" required placeholder=" " />
          <label for="auth-password">Password (min 6 characters)</label>
        </div>

        <!-- Material Indeterminate Progress Bar -->
        <div class="progress-bar-container" id="auth-progress">
          <div class="progress-bar-indicator"></div>
        </div>

        <button type="submit" id="auth-submit-btn" class="btn-primary">
          <span id="auth-btn-text">Continue</span>
          <svg id="auth-btn-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>

        <p id="auth-error" class="error-msg"></p>
      </form>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="app-screen" class="screen">
    <div class="app-layout" id="app-layout">

      <!-- VIEW 1: CONTACTS LIST -->
      <section class="screen-view view-contacts" id="view-contacts">
        <header class="mobile-header">
          <div class="user-pill">
            <div class="avatar my-avatar" id="current-user-avatar">?</div>
            <div class="user-meta">
              <strong id="current-user-name">Loading...</strong>
              <span class="online-tag">● Online</span>
            </div>
          </div>
          <button id="logout-btn" class="action-btn" title="Sign Out">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </header>

        <div class="search-wrap">
          <div class="search-box">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="search-input" placeholder="Search users by name..." />
          </div>
        </div>

        <div class="contacts-scroll" id="users-list">
          <!-- Dynamically populated contacts -->
        </div>
      </section>

      <!-- VIEW 2: ACTIVE CONVERSATION -->
      <section class="screen-view view-chat" id="view-chat">
        <!-- Chat Header -->
        <header class="mobile-header chat-header">
          <button class="action-btn back-btn" id="chat-back-btn" title="Back to chats">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
          </button>
          <div class="avatar" id="recipient-avatar">?</div>
          <div class="chat-header-info">
            <h4 id="recipient-name">Recipient</h4>
            <span id="recipient-status" class="status-subtitle">Offline</span>
          </div>
        </header>

        <!-- Message List -->
        <div class="chat-viewport" id="messages-viewport">
          <div class="messages-container" id="messages-list"></div>
        </div>

        <!-- Typing Indicator -->
        <div class="typing-bubble" id="typing-indicator">
          <span class="typing-text">typing</span>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>

        <!-- Bottom Composer with Prominent Send Button -->
        <footer class="composer-container">
          <!-- Emoji Drawer -->
          <div class="emoji-drawer" id="emoji-picker">
            <span>😀</span><span>😂</span><span>😍</span><span>🥰</span><span>😎</span>
            <span>😜</span><span>🤫</span><span>🤔</span><span>👍</span><span>🔥</span>
            <span>❤️</span><span>💖</span><span>🎉</span><span>🙏</span><span>💯</span>
          </div>

          <div class="composer-row">
            <button type="button" class="action-btn emoji-btn" id="emoji-toggle-btn" title="Add emoji">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                <line x1="9" y1="9" x2="9.01" y2="9"></line>
                <line x1="15" y1="9" x2="15.01" y2="9"></line>
              </svg>
            </button>
            <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" />
            
            <!-- High-Visibility Send Button -->
            <button type="button" class="send-btn" id="send-btn" title="Send message">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
              </svg>
            </button>
          </div>
        </footer>
      </section>

    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>

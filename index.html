<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PinkTalk | Messenger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols-Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="auth-screen" class="screen active">
    <div class="auth-card">
      <div class="auth-header">
        <span class="material-symbols-rounded auth-icon">chat_bubble</span>
        <h2>PinkTalk</h2>
        <p>Login or auto-create your account</p>
      </div>
      <form id="auth-form">
        <div class="material-field">
          <input type="text" id="auth-username" required placeholder=" " autocomplete="off" />
          <label for="auth-username">Username or ID</label>
        </div>
        <div class="material-field">
          <input type="password" id="auth-password" required placeholder=" " />
          <label for="auth-password">Password</label>
        </div>
        <button type="submit" id="auth-submit-btn" class="btn-primary">
          <span>Continue</span>
          <span class="material-symbols-rounded">arrow_forward</span>
        </button>
        <p id="auth-error" class="error-msg"></p>
      </form>
    </div>
  </div>

  <div id="app-screen" class="screen">
    <div class="app-layout">

      <aside class="sidebar" id="sidebar">
        <header class="sidebar-header">
          <div class="user-profile">
            <div class="avatar" id="current-user-avatar">?</div>
            <div class="user-details">
              <strong id="current-user-name">Loading...</strong>
              <span class="status-indicator online">Online</span>
            </div>
          </div>
          <button id="logout-btn" class="icon-btn" title="Sign Out">
            <span class="material-symbols-rounded">logout</span>
          </button>
        </header>

        <div class="search-bar-container">
          <div class="material-search">
            <span class="material-symbols-rounded">search</span>
            <input type="text" id="search-input" placeholder="Search users by name..." />
          </div>
        </div>

        <div class="user-list" id="users-list">
          </div>
      </aside>

      <main class="chat-area" id="chat-area">
        <div class="empty-state" id="empty-state">
          <span class="material-symbols-rounded">forum</span>
          <h3>Select a contact to start chatting</h3>
        </div>

        <section class="active-chat-container" id="active-chat" style="display: none;">
          <header class="chat-header">
            <button class="icon-btn back-btn" id="chat-back-btn">
              <span class="material-symbols-rounded">arrow_back</span>
            </button>
            <div class="avatar" id="recipient-avatar">?</div>
            <div class="chat-header-info">
              <h4 id="recipient-name">Recipient</h4>
              <p id="recipient-status" class="presence-text">Offline</p>
            </div>
          </header>

          <div class="messages-viewport" id="messages-viewport">
            <div class="messages-list" id="messages-list"></div>
          </div>

          <div class="typing-bubble" id="typing-indicator">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>

          <div class="composer-container">
            <div class="emoji-picker" id="emoji-picker">
              <span>😀</span><span>😁</span><span>😂</span><span>🤣</span><span>😊</span>
              <span>😍</span><span>🥰</span><span>😘</span><span>😜</span><span>🤗</span>
              <span>🤔</span><span>🤐</span><span>😴</span><span>❤️</span><span>💖</span>
              <span>🔥</span><span>🎉</span><span>👍</span><span>🙏</span><span>💯</span>
            </div>

            <div class="composer-bar">
              <button type="button" class="icon-btn" id="emoji-toggle-btn">
                <span class="material-symbols-rounded">mood</span>
              </button>
              <div class="material-chat-field">
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" />
              </div>
              <button class="send-btn" id="send-btn">
                <span class="material-symbols-rounded">send</span>
              </button>
            </div>
          </div>
        </section>
      </main>

    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
